name: Fuzz

on:
  schedule:
    - cron: "31 2 * * *"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  campaigns:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: bazelbuild/setup-bazelisk@v3
      # Do not cache the multi-gigabyte hermetic LLVM repository. The ordinary test workflow already
      # enforces the repository's cache-size ceiling, and this daily job values bounded storage over
      # avoiding one toolchain download.
      - name: Run every bounded fuzz campaign
        run: tools/fuzz_targets.py --campaign-seconds=60
