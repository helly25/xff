# Release: on a version tag push (e.g. `git tag v0.1.0 && git push origin v0.1.0`,
# or `tools/trigger_release.sh 0.1.0`), build the lean and full binaries for Linux
# and macOS and cut a GitHub release with them attached and the CHANGELOG section
# as the body.
#
# xff is not published to a registry; it ships as a tool. The version is stamped
# from the tag at build time (override-on-release, see tools/release_prep.sh),
# so the repository itself stays at the 0.0.0 sentinel and there are no
# version-bump commits.
#
# The tag is pushed by a maintainer's credentials, so this workflow triggers
# normally (a one-click dispatch that pushed the tag with the default
# GITHUB_TOKEN would NOT, per the "GITHUB_TOKEN does not trigger downstream
# workflows" rule; a PAT-based trigger can be added later if wanted).
name: Release

on:
  push:
    tags:
      # v-prefixed numeric semver only (e.g. v0.1.0). The `v` gives a clean `v*`
      # tag-protection glob; release_prep.sh strips it to the bare stamped version.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel coverage disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-coverage-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-disk-coverage-
      - name: Mount Bazel repo cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-ubuntu-latest-default-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-repo-ubuntu-latest-default-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install GCC 14 and coverage dependencies
        run: |
          sudo apt-get install -y gcc-14 g++-14 lcov mandoc fuse3 libfuse3-3
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14 \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-14
          sudo update-alternatives --set gcc /usr/bin/gcc-14
      - name: Collect release coverage
        # --config=xff_full enables the aggregate xff_all switch, so extensions added to the
        # registry join release coverage automatically.
        run: |
          set -euo pipefail
          tools/release_prep.sh "${GITHUB_REF_NAME}" >/dev/null
          coverage_page="tag/${GITHUB_REF_NAME#v}"
          # shellcheck disable=SC2046  # deliberate splitting into Bazel target patterns
          bazel coverage //... $(tools/extras.py --wildcards) \
            --config=xff_full \
            --combined_report=lcov \
            --disk_cache=$HOME/.cache/bazel-disk \
            --instrumentation_filter='//xff[/:],//xff_extras_api[/:],@@xff_(archive|fuse|pcre2)[+]//' \
            --repository_cache=$HOME/.cache/bazel-repo
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" coverage.lcov
          printf '%s\n' "${coverage_page}" >coverage-target.txt
          python3 tools/coverage_sources.py coverage.lcov coverage-html.lcov
          genhtml coverage-html.lcov \
            --branch-coverage \
            --demangle-cpp \
            --function-coverage \
            --ignore-errors negative \
            --legend \
            --output-directory coverage-html/lcov \
            --show-details \
            --title "xff ${GITHUB_REF_NAME} production coverage"
          python3 -m unittest tools/coverage_test.py tools/coverage_sources_test.py tools/coverage_index_test.py
          python3 tools/coverage.py \
            --json-summary coverage-html/coverage-summary.json \
            --lcov coverage.lcov \
            --policy coverage_policy.json \
            --summary coverage-summary.md
          python3 tools/coverage_index.py report \
            coverage-html/coverage-summary.json "${coverage_page}" coverage-html/index.html
          {
            echo "### Production coverage"
            echo
            echo "[Browse the HTML coverage report](https://helly25.github.io/xff/coverage/${coverage_page}/)."
            echo
            echo "[Download this run's coverage artifact](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts)."
            echo
            cat coverage-summary.md
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage-html/
            coverage.lcov
            coverage-summary.md
            coverage-target.txt
          retention-days: 14
          if-no-files-found: error

  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      # If one platform fails, do not publish a half-built release.
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v6
      # bazelisk launches the Bazel release pinned in .bazelversion.
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-release-${{ matrix.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-release-${{ matrix.os }}-
            bazel-${{ matrix.os }}-default-
      # Stamp the tag version into MODULE.bazel + main.cc and verify consistency
      # (discard the notes it prints; the release job re-derives them).
      - name: Stamp version + verify
        run: tools/release_prep.sh "${GITHUB_REF_NAME}" >/dev/null
      - name: Build lean + full binaries
        run: |
          bazel build -c opt //xff/cli:xff \
            --disk_cache="${HOME}/.cache/bazel-disk" --repository_cache="${HOME}/.cache/bazel-repo"
          bazel build -c opt --config=xff_full //xff/cli:xff_full \
            --disk_cache="${HOME}/.cache/bazel-disk" --repository_cache="${HOME}/.cache/bazel-repo"
      - name: Stage artifacts
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          arch="$(uname -m)"
          mkdir -p dist
          lean="$(bazel cquery -c opt --output=files //xff/cli:xff 2>/dev/null)"
          full="$(bazel cquery -c opt --config=xff_full --output=files //xff/cli:xff_full 2>/dev/null)"
          install -m 0755 "${lean}" "dist/xff-${PLATFORM}-${arch}"
          install -m 0755 "${full}" "dist/xff_full-${PLATFORM}-${arch}"
      - uses: actions/upload-artifact@v4
        with:
          name: xff-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, coverage]
    runs-on: ubuntu-latest
    permissions:
      # Creating a release writes to the repo's releases.
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: xff-*
          path: dist
          merge-multiple: true
      # release_prep.sh prints only the CHANGELOG section to stdout (the stamp it
      # also does here is a harmless no-op; nothing is built in this job).
      - name: Generate release notes
        run: tools/release_prep.sh "${GITHUB_REF_NAME}" > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --notes-file release-notes.md
          --verify-tag
          dist/*
