name: Publish coverage

on:
  workflow_run:
    workflows: [Release, Test]
    types: [completed]

# Updating the retained site and deploying it must be one serial operation: two runs restoring the
# same branch concurrently would otherwise overwrite whichever report was pushed first.
concurrency:
  group: coverage-pages
  cancel-in-progress: false

permissions: read-all

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This workflow always comes from the trusted default branch. It consumes the report emitted
      # by an unprivileged test run; PR code never receives the token that updates Pages.
      - uses: actions/checkout@v6
        with:
          path: source
          ref: main
      - uses: actions/checkout@v6
        with:
          path: site
          ref: coverage-pages
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: coverage-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
      - name: Select and stage the report
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          target="$(<report/coverage-target.txt)"
          if [[ ! "${target}" =~ ^(main|pr/[1-9][0-9]*|tag/[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid coverage target: ${target}" >&2
            exit 1
          fi
          # Migrate the original flat PR namespace without breaking links already shared in reviews.
          for legacy in site/coverage/pr[1-9]*; do
            if [[ ! -d "${legacy}" ]]; then
              continue
            fi
            number="${legacy##*pr}"
            mkdir -p site/coverage/pr
            git -C site mv "coverage/pr${number}" "coverage/pr/${number}"
            mkdir -p "site/coverage/pr${number}"
            printf '%s\n' \
              '<!doctype html><meta http-equiv="refresh" content="0; url=../pr/'"${number}"'/">' \
              '<link rel="canonical" href="../pr/'"${number}"'/">' \
              >"site/coverage/pr${number}/index.html"
          done
          mkdir -p "site/coverage/${target}"
          rsync --archive --delete report/coverage-html/ "site/coverage/${target}/"
          python3 source/tools/coverage_index.py site site/coverage site/coverage/index.html
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add coverage
          if git -C site diff --cached --quiet; then
            echo "Coverage report is unchanged"
          else
            git -C site commit -m "coverage: publish ${target} from run ${SOURCE_RUN_ID}"
            git -C site push
          fi
          mkdir -p public
          rsync --archive site/coverage/ public/coverage/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
