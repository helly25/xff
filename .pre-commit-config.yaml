#
# pre-commit configuration (https://pre-commit.com). Mirrors helly25/mbo's set,
# trimmed to what xff uses. Install once with `pre-commit install`; run over the
# whole tree with `pre-commit run -a`. clang-tidy runs here too (the local-only
# `clang-tidy` hook, via tools/clang_tidy.sh using the hermetic clang-22); the
# broader linters live in trunk (.trunk/trunk.yaml). clang-format here is pinned to v20.1.8 to match the
# hermetic toolchain clang-format (tools/clang_format.sh + the CI test step)
# byte-for-byte; keep this pin in lockstep with the LLVM toolchain version. A
# mismatch surfaces loudly as a CI clang-format failure rather than silent
# reformatting churn. This file owns clang-format, shell, YAML, workflow and
# repo-policy text checks.
#
# Pin the Python that pre-commit builds its managed hook environments with to 3.13
# (the version CI runs via actions/setup-python), so a contributor whose default
# `python3` is older does not silently validate against an ancient interpreter.
default_language_version:
  python: python3.13
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflow files
        description: Runs actionlint to lint GitHub Actions workflow files
        language: golang
        types: ["yaml"]
        files: ^\.github/workflows/
        entry: actionlint
        args: ["-shellcheck", ""]

  - repo: local
    hooks:
      - id: no-do-not-merge
        name: No 'DO NOT MERGE'
        description: |
          Add 'DONOTMERGE', 'DONOTSUBMIT', 'DO NOT MERGE', 'DO NOT SUBMIT', "DON'T MERGE",
          "DON'T SUBMIT" (or the underscore forms) to block merging. To skip this hook once,
          run `SKIP="no-do-not-merge" pre-commit`.
        language: pygrep
        args: [-i]
        entry: DO([ _]?NOT|N'T)[ _]?(SUBMIT|MERGE)
        exclude: ^.pre-commit-config.yaml$
        types: [text]
      - id: no-em-dashes
        name: No em-dashes
        description: |
          Project convention: never an em-dash (U+2014) anywhere (prose, docs, comments,
          commit messages). Use a spaced hyphen instead.
        language: pygrep
        entry: "—"
        exclude: ^.pre-commit-config.yaml$
        types: [text]
      - id: no-todos-without-context
        name: No TODOs without context
        description: |
          Use referenceable TODOs: `// TODO(user@helly25.com)` or
          `# FIXME(https://github.com/helly25/xff/issues/42)`. A bare TODO/FIXME with no
          email or URL is unmaintainable. To skip once, run
          `SKIP="no-todos-without-context" pre-commit`.
        language: pygrep
        args: [-i]
        exclude: ^[.]pre-commit-config.yaml$
        entry: (#|//|/[*]).*(FIXME|TODO)[(](?!(((\w|\w[.-]\w)+@(\w|-)+([.](\w|-)+)*)|(https?://[^)]+))(,[^)]+)?)[)]
        types: [text]
      - id: no-shell-grep-in-bashtests
        name: No hand-rolled grep in bashtests
        description: |
          Project convention (STYLE_CPP.md): a bashtest asserts on captured output with
          helly25/bashtest content matchers (expect_output_contains / expect_matches),
          never a hand-rolled shell `grep` - a piped `grep -q` misfires on SIGPIPE under
          `set -o pipefail`, and `$(grep -q ... && echo yes)` drops the output on failure.
          To skip once, run `SKIP="no-shell-grep-in-bashtests" pre-commit`.
        language: script
        entry: tools/check_bashtest_grep.sh
        files: _test\.sh$
      - id: align-markdown-tables
        name: Align Markdown tables
        description: |
          Project convention (AGENTS.md): GitHub-flavored Markdown tables are kept
          vertically aligned (the pipes line up). This formatter pads each column to
          its widest cell, honoring the delimiter alignment markers, and rewrites the
          file in place. To skip once, run `SKIP="align-markdown-tables" pre-commit`.
        language: script
        entry: tools/align_markdown_tables.py
        types: [markdown]
      - id: align-markdown-tables-test
        name: Test the Markdown table aligner
        description: Runs the table-aligner unit tests when the tool or its test changes.
        language: script
        entry: tools/align_markdown_tables_test.py
        files: ^tools/align_markdown_tables(_test)?\.py$
        pass_filenames: false
      - id: check-module-versions
        name: Modules share one version
        description: |
          The git tag is the version source of truth; the repo stays at the 0.0.0
          sentinel and the release workflow stamps the tag's version everywhere. This
          asserts every in-repo MODULE.bazel version, every intra-repo bazel_dep on one
          of our modules, and the `xff --version` literal already agree, so the stamp
          has one uniform value to replace and nothing ships a stale version.
        language: script
        entry: tools/check_module_versions.py
        files: ((^|/)MODULE\.bazel|^xff/cli/main\.cc|^tools/check_module_versions\.py)$
        pass_filenames: false
      - id: check-module-versions-test
        name: Test the module-version check
        description: Runs the version-check unit tests when the tool or its test changes.
        language: script
        entry: tools/check_module_versions_test.py
        files: ^tools/check_module_versions(_test)?\.py$
        pass_filenames: false
      - id: check-cc-target-naming
        name: cc_library targets end in _cc
        description: |
          Project convention (STYLE_CPP.md): a C++ library target is named `<thing>_cc`
          (glob_cc, license_cc, vfs_cc), so a label reads as "the C++ library for <thing>"
          and never collides with the directory, header or binary of the same name. Tests
          keep their `_test` suffix and are not checked. To skip once, run
          `SKIP="check-cc-target-naming" pre-commit`.
        language: script
        entry: tools/check_cc_target_naming.py
        files: (^|/)BUILD(\.bazel)?$
      - id: check-cc-target-naming-test
        name: Test the cc_library naming check
        description: |
          Runs the naming-check unit tests when the tool, its test, or the shared BUILD
          reader it is built on (tools/build_rules.py) changes.
        language: script
        entry: tools/check_cc_target_naming_test.py
        files: ^tools/(check_cc_target_naming(_test)?|build_rules)\.py$
        pass_filenames: false
      - id: check-cc-library-tested
        name: Every cc_library has a test
        description: |
          Project rule (STYLE_CPP.md): all exported code is tested, at every level. This
          fails on a `cc_library` that no `*_test` rule in its own package depends on -
          transitive coverage and non-test dependents (a cc_binary, a bashtest) do not
          count. A library with genuinely no testable surface goes in the tool's
          _ALLOWLIST together with the reason. To skip once, run
          `SKIP="check-cc-library-tested" pre-commit`.
        language: script
        entry: tools/check_cc_library_tested.py
        files: (^|/)BUILD(\.bazel)?$
      - id: check-cc-library-tested-test
        name: Test the library-has-a-test check
        description: |
          Runs the coverage-check unit tests when the tool, its test, or the shared BUILD
          reader it is built on (tools/build_rules.py) changes.
        language: script
        entry: tools/check_cc_library_tested_test.py
        files: ^tools/(check_cc_library_tested(_test)?|build_rules)\.py$
        pass_filenames: false
      - id: build-rules-test
        name: Test the shared BUILD reader
        description: Runs the BUILD-reader unit tests when it or its test changes.
        language: script
        entry: tools/build_rules_test.py
        files: ^tools/build_rules(_test)?\.py$
        pass_filenames: false
      - id: release-prep-test
        name: Test the release prep script
        description: |
          Runs the release_prep unit test (CHANGELOG guard, version stamping,
          consistency check, release-notes output) when the release script, its
          test, or the version check it calls changes.
        language: script
        entry: tools/release_prep_test.sh
        files: ^tools/(release_prep\.sh|release_prep_test\.sh|check_module_versions\.py)$
        pass_filenames: false
      - id: trigger-release-test
        name: Test the release trigger next-version logic
        description: |
          Runs the trigger_release unit test (next-version default minor bump,
          explicit override, strictly-greater X.Y.Z check) when the trigger
          script or its test changes.
        language: script
        entry: tools/trigger_release_test.sh
        files: ^tools/(trigger_release\.sh|trigger_release_test\.sh)$
        pass_filenames: false
      - id: clang-tidy
        name: clang-tidy (opt-in locally; gated by the CI clang-tidy job)
        description: |
          Runs clang-tidy over the given C++ sources via tools/clang_tidy.sh, a report-only
          pass (no --fix, so it never rewrites the tree). It needs a compile_commands.json (a
          gitignored local artifact; build it with ./compile_commands-update.sh) and a hermetic
          clang-tidy (>= clang-22 for this C++23 codebase); it SKIPS cleanly when either is
          missing, so it never forces the toolchain download on a fresh checkout.
          `stages: [manual]` keeps it off the local commit hook (run it explicitly with
          `pre-commit run clang-tidy --all-files --hook-stage manual`), but the dedicated CI
          `clang-tidy` job owns it as a HARD GATE: that job builds the compile DB and runs this
          hook with `--hook-stage manual`, and `.clang-tidy` is `WarningsAsErrors: '*'`, so any
          finding fails CI. It is not run by trunk (trunk pinned clang-tidy 16, which mis-parses
          C++23 - do not re-add it there).
        language: script
        entry: tools/clang_tidy.sh
        types_or: [c++]
        files: \.(cc|cpp|cxx)$
        # Skip the composable build extras (extra_modules/<name>): each is a flag-gated optional
        # local module whose external deps (e.g. pcre2.h) are absent from a lean build, so the core
        # clang-tidy gate cannot parse them. They get linted under their own build config, not here.
        exclude: ^extra_modules/
        stages: [manual]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.11.0-1
    hooks:
      - id: shfmt
        args: ["-bn", "-ci", "-i=2", "-w"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
